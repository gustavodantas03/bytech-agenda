{% extends 'admin/base.html' %}

{% block title %}
Editar {{ ui.profissional_singular if ui else 'profissional' }}
{% endblock %}

{% block content %}
<header class="page-header">
    <div>
        <span>Equipe</span>
        <h1>Editar {{ ui.profissional_singular if ui else 'profissional' }}</h1>
    </div>
</header>

<section class="panel narrow-panel">
    <form method="post">
        <label for="nome">Nome</label>
        <input
            id="nome"
            name="nome"
            value="{{ funcionario.nome }}"
            required
        >

        <label for="cargo">Cargo</label>
        <input
            id="cargo"
            name="cargo"
            value="{{ funcionario.cargo or (ui.cargo_padrao if ui else 'Profissional') }}"
            required
        >

        <button class="btn btn-primary" type="submit">
            Salvar alterações
        </button>

        <a class="btn btn-secondary" href="{{ url_for('admin_funcionarios') }}">
            Voltar
        </a>
    </form>
</section>
{% endblock %}
