{% extends 'admin/base.html' %}

{% block title %}
Novo agendamento
{% endblock %}

{% block content %}

<header class="page-header">

    <div>
        <span>Agenda</span>
        <h1>Novo agendamento</h1>
    </div>

    <a
        class="btn btn-secondary"
        href="{{ url_for('admin_agenda') }}"
    >
        Voltar
    </a>

</header>

<section class="panel narrow-panel">

    <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <label for="cliente_nome">
            Nome do cliente
        </label>

        <input
            id="cliente_nome"
            name="cliente_nome"
            type="text"
            placeholder="Digite o nome do cliente"
            required
        >

        <label for="cliente_telefone">
            WhatsApp
        </label>

        <input
            id="cliente_telefone"
            name="cliente_telefone"
            type="text"
            placeholder="(85) 99999-9999"
            required
        >

        <label for="servico_id">
            Serviço
        </label>

        <select
            id="servico_id"
            name="servico_id"
            required
        >

            <option value="">
                Selecione o serviço
            </option>

            {% for servico in servicos %}

                <option value="{{ servico.id }}" data-duracao="{{ servico.duracao }}">
                    {{ servico.nome }}
                    — R$
                    {{ '%.2f'|format(servico.valor)|replace('.', ',') }}
                </option>

            {% endfor %}

        </select>

        <label for="funcionario_id">
    {{ ui.profissional_singular|capitalize if ui else 'Profissional' }}
</label>

        <select
            id="funcionario_id"
            name="funcionario_id"
            required
        >

           <option value="">
    Selecione {{ ui.profissional_singular if ui else 'o profissional' }}
</option>

            {% for funcionario in funcionarios %}

                <option value="{{ funcionario.id }}">
                    {{ funcionario.nome }}
                </option>

            {% endfor %}

        </select>

        <label for="data">
            Data
        </label>

        <input
            id="data"
            name="data"
            type="date"
            min="{{ data_hoje }}"
            value="{{ data_hoje }}"
            required
        >

        <label for="hora">
            Horário
        </label>

        <select
            id="hora"
            name="hora"
            required
        >

            <option value="">
                Selecione o horário
            </option>

            {% for horario in horarios %}

                <option value="{{ horario }}">
                    {{ horario }}
                </option>

            {% endfor %}

        </select>

        {% if tem_recurso and tem_recurso('whatsapp') %}
        <label style="display:flex;align-items:center;gap:10px;margin:14px 0 18px;padding:14px;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;">
            <input type="checkbox" name="enviar_confirmacao" value="1" checked style="width:auto;">
            <span><strong>Enviar confirmação pelo WhatsApp</strong><br><small style="color:#64748b;">A mensagem será enviada após salvar o agendamento.</small></span>
        </label>
        {% endif %}

        <button
            class="btn btn-primary full"
            type="submit"
        >
            Salvar agendamento
        </button>

    </form>

</section>

<script>
(function () {
    const campoData = document.getElementById("data");
    const campoHora = document.getElementById("hora");
    const campoServico = document.getElementById("servico_id");
    const campoFuncionario = document.getElementById("funcionario_id");
    if (!campoData || !campoHora) return;

    async function atualizarHorarios() {
        const data = campoData.value;
        const funcionarioId = campoFuncionario ? campoFuncionario.value : "";
        if (!data) return;

        const opcaoServico = campoServico ? campoServico.selectedOptions[0] : null;
        const duracao = opcaoServico ? (opcaoServico.dataset.duracao || 40) : 40;

        const params = new URLSearchParams({
            data: data,
            duracao_total: duracao
        });
        if (funcionarioId) params.set("funcionario_id", funcionarioId);

        const horaAtual = campoHora.value;
        try {
            const resposta = await fetch(
                "{{ url_for('admin_horarios_disponiveis') }}?" + params.toString(),
                {headers: {"Accept": "application/json"}, credentials: "same-origin"}
            );
            const dados = await resposta.json();
            const horarios = dados.horarios || [];

            campoHora.innerHTML = "";
            const opcaoVazia = document.createElement("option");
            opcaoVazia.value = "";
            opcaoVazia.textContent = horarios.length
                ? "Selecione o horário"
                : "Nenhum horário disponível neste dia";
            campoHora.appendChild(opcaoVazia);

            horarios.forEach(function (horario) {
                const opcao = document.createElement("option");
                opcao.value = horario;
                opcao.textContent = horario;
                if (horario === horaAtual) opcao.selected = true;
                campoHora.appendChild(opcao);
            });
        } catch (erro) {
            // Se a chamada falhar, mantém a lista atual do servidor.
        }
    }

    campoData.addEventListener("change", atualizarHorarios);
    if (campoFuncionario) campoFuncionario.addEventListener("change", atualizarHorarios);
    if (campoServico) campoServico.addEventListener("change", atualizarHorarios);
})();
</script>

{% endblock %}
