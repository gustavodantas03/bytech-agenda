<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytech Agenda | Acesso administrativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-login-page">
    <main class="login-card">
        <div class="logo-mark">B</div>
        <h1>Bytech Agenda</h1>
        <p>Acesse o painel administrativo da sua empresa.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <label>Usuário</label>
            <input name="usuario" required autocomplete="username">

            <label>Senha</label>
            <input type="password" name="senha" required autocomplete="current-password">

            <button class="btn btn-primary full">Entrar</button>
        </form>
    </main>
</body>
</html>
