<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bytech Agenda{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-page">
    <aside class="sidebar">
        <div class="brand">
            <div class="logo-mark small">B</div>
            <div>
                <strong>Bytech</strong>
                <span>Agenda</span>
            </div>
        </div>

        <nav>
            <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin_agenda') }}">Agenda</a>
            <a href="{{ url_for('admin_funcionarios') }}">Funcionários</a>
            <a href="{{ url_for('admin_servicos') }}">Serviços</a>
            <a href="{{ url_for('admin_barbearia') }}">Barbearia</a>
            <a href="{{ url_for('admin_sair') }}">Sair</a>
        </nav>
    </aside>

    <main class="admin-content">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
