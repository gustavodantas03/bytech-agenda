{% extends 'admin/base.html' %}
{% block title %}Editar serviço{% endblock %}
{% block content %}
<header class="page-header"><div><span>Serviços</span><h1>Editar serviço</h1></div></header>
<section class="panel narrow-panel">
    <form method="post">
        <label>Nome</label><input name="nome" value="{{ servico.nome }}" required>
        <label>Valor</label><input name="valor" type="number" step="0.01" value="{{ servico.valor }}" required>
        <label>Duração em minutos</label><input name="duracao" type="number" value="{{ servico.duracao }}" required>
        <button class="btn btn-primary">Salvar alterações</button>
        <a class="btn btn-secondary" href="{{ url_for('admin_servicos') }}">Voltar</a>
    </form>
</section>
{% endblock %}
