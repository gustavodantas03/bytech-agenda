<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bytech Master</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="admin-login-page">

    <main class="login-card">

        <img class="logo-mark bytech-system-logo" src="{{ url_for('static', filename='img/bytech-agenda-icon.png') }}" alt="Bytech Agenda">

        <h1>Bytech Master</h1>

        <p>Gerencie empresas, planos, usuários e configurações da plataforma.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <label>Usuário</label>

            <input
                name="usuario"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required
            >

            <button class="btn btn-primary full">
                Entrar
            </button>

        </form>

    </main>

</body>
</html>
