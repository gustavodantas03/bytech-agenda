{% extends 'master/base.html' %}{% block title %}Configurações Financeiras{% endblock %}{% block content %}
<div class="finance-head"><div><span>Financeiro Master</span><h1>Configurações financeiras</h1><p>Defina as regras padrão para novas empresas e cobranças.</p></div></div>
<form method="post" class="panel finance-settings"><div class="panel-header"><div><span>Regras padrão</span><h2>Vencimento e bloqueio</h2></div></div><div class="settings-grid"><label>Dia de vencimento padrão<input type="number" name="dia_vencimento_padrao" min="1" max="28" value="{{ cfg.dia_vencimento_padrao }}" required></label><label>Dias de tolerância<input type="number" name="tolerancia_dias_padrao" min="0" value="{{ cfg.tolerancia_dias_padrao }}" required></label><label>Bloquear após quantos dias<input type="number" name="bloquear_apos_dias_padrao" min="0" value="{{ cfg.bloquear_apos_dias_padrao }}" required></label><label>Forma de pagamento padrão<select name="forma_pagamento_padrao">{% for f in ['Pix','Boleto','Cartão','Dinheiro','Transferência'] %}<option {% if cfg.forma_pagamento_padrao==f %}selected{% endif %}>{{ f }}</option>{% endfor %}</select></label><label>Multa por atraso (%)<input type="number" step="0.01" min="0" name="multa_percentual" value="{{ cfg.multa_percentual }}"></label><label>Juros mensal (%)<input type="number" step="0.01" min="0" name="juros_mensal_percentual" value="{{ cfg.juros_mensal_percentual }}"></label><label>Desconto antecipação (%)<input type="number" step="0.01" min="0" name="desconto_antecipacao_percentual" value="{{ cfg.desconto_antecipacao_percentual }}"></label></div><label>Mensagem padrão de cobrança<textarea name="mensagem_cobranca" rows="4">{{ cfg.mensagem_cobranca or '' }}</textarea></label><label class="check-setting"><input type="checkbox" name="aplicar_empresas" value="1"><span>Aplicar dia de vencimento, tolerância e bloqueio às empresas já cadastradas.</span></label><div class="form-actions"><button class="btn" type="submit">Salvar configurações</button></div></form>
{% endblock %}
